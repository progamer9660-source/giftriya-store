<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIFTRIYA — Admin & Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#171717}
header{background:#111;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800;letter-spacing:1px}.wrap{max-width:1180px;margin:30px auto;padding:0 20px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0000000b;margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:6px 0 14px;font-size:14px}
button{border:0;border-radius:9px;padding:11px 16px;background:#111;color:white;cursor:pointer;font-weight:700}
button.red{background:#c62828}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.product img{width:100%;height:210px;object-fit:cover;border-radius:12px;background:#eee}.muted{color:#777;font-size:13px}.price{font-size:21px;font-weight:800}
#admin,#store{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.row{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{background:#eee;color:#111}.tabs button.active{background:#111;color:#fff}
</style></head><body>
<header><div class="logo">GIFTRIYA</div><div id="status">Store</div></header>
<div class="wrap">
<section id="login" class="card" style="max-width:430px;margin:60px auto">
<h2>Admin Login</h2><p class="muted">Only authorized GIFTRIYA admin can manage listings.</p>
<input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button><p id="err" style="color:#c62828"></p>
</section>
<section id="admin">
<div class="tabs"><button class="active" onclick="showTab('products',this)">Products</button><button onclick="showTab('add',this)">+ Add Product</button><button onclick="logout()">Logout</button></div>
<div id="products" class="card"><h2>My Listings</h2><div id="list" class="grid"></div></div>
<div id="add" class="card" style="display:none"><h2>Add New Product</h2>
<form id="form" enctype="multipart/form-data"><div class="row"><div><label>Product Name *</label><input name="name" required></div><div><label>SKU</label><input name="sku"></div></div>
<div class="row"><div><label>Category</label><input name="category" placeholder="Gifts, Home, Stationery..."></div><div><label>Stock</label><input name="stock" type="number" value="10"></div></div>
<div class="row"><div><label>Selling Price *</label><input name="price" type="number" required></div><div><label>MRP</label><input name="mrp" type="number"></div></div>
<label>Description</label><textarea name="description" rows="5"></textarea><label>Product Image (max 5MB)</label><input name="image" type="file" accept="image/*">
<button type="submit">Publish Product</button></form><p id="msg"></p></div>
</section>
<section id="store"><div class="card"><h1>GIFTRIYA Store</h1><p class="muted">Products published from the private admin panel appear here.</p><div id="storelist" class="grid"></div></div></section>
</div>
<script>
const token=()=>localStorage.getItem("giftriya_admin_token");
function login(){fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value})}).then(r=>r.json()).then(x=>{if(x.token){localStorage.setItem("giftriya_admin_token",x.token);location.reload()}else err.textContent=x.error})}
function logout(){localStorage.removeItem("giftriya_admin_token");location.reload()}
function showTab(id,b){document.querySelectorAll("#admin .card").forEach(x=>x.style.display="none");document.getElementById(id).style.display="block";document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="products")loadAdmin()}
async function loadAdmin(){let ps=await fetch("/api/products").then(r=>r.json());list.innerHTML=ps.map(p=>`<div class="product"><img src="${p.image||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23eee%22/%3E%3C/svg%3E'}"><h3>${esc(p.name)}</h3><div class="price">₹${p.price}</div><div class="muted">SKU: ${esc(p.sku)} · Stock: ${p.stock} · ${p.active?'LIVE':'OFF'}</div><br><button class="red" onclick="del(${p.id})">Delete</button></div>`).join("")}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function del(id){if(!confirm("Delete this listing?"))return;await fetch("/api/products/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token()}});loadAdmin();loadStore()}
form.onsubmit=async e=>{e.preventDefault();msg.textContent="Publishing...";let r=await fetch("/api/products",{method:"POST",headers:{Authorization:"Bearer "+token()},body:new FormData(form)});let x=await r.json();msg.textContent=r.ok?"Published live ✓":x.error||"Error";if(r.ok){form.reset();loadAdmin();loadStore()}}
async function loadStore(){let ps=await fetch("/api/products").then(r=>r.json());storelist.innerHTML=ps.filter(p=>p.active&&p.stock>0).map(p=>`<div class="product"><img src="${p.image||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23eee%22/%3E%3C/svg%3E'}"><h3>${esc(p.name)}</h3><div class="price">₹${p.price}</div><p class="muted">${esc(p.description)}</p><button>Add to Cart</button></div>`).join("")}
if(token()){login.style.display="none";admin.style.display="block";loadAdmin()}else{login.style.display="block"}loadStore();
</script></body></html>
